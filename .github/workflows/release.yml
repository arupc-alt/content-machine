name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repo checks
        run: python3 scripts/check.py
      - name: Tag matches the skill version
        run: |
          v=$(python3 -c "import json;print(json.load(open('plugins/content-machine/.claude-plugin/plugin.json'))['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} doesn't match version $v"; exit 1; }
      - name: Build zips
        run: python3 scripts/build_zip.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/content-machine.zip
            dist/content-machine-pipeline.zip
          body_path: CHANGELOG.md
